[project]
name = "job-smith"
version = "0.1.0"
description = "Local, LLM-assisted job search: discover -> dedupe -> match -> report"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "pypdf>=4.0",
]

[project.scripts]
job-smith = "job_smith.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["job_smith"]
